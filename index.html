/* Paleta NUMMEROS (verde) · claro por defecto, modo oscuro verde con .dark · layout barra lateral a pantalla completa */
:root{
  --bg:#F3F8F4; --panel:#FFFFFF; --panel2:#EEF4F0; --line:#E2ECE5;
  --txt:#0E2A24; --muted:#5E7A70; --accent:#235347; --accent-ink:#FFFFFF;
  --sage:#8EB69B; --tint:#DAF1DE; --green:#2E7D5B; --danger:#B4453C; --warn:#9A7B3F;
  --ok:#2E7D5B; --info:#6B8F86;
}
html.dark{
  --bg:#07201C; --panel:#0E2A24; --panel2:#143A32; --line:#1E4A40;
  --txt:#EAF3EE; --muted:#8FB0A6; --accent:#8EB69B; --accent-ink:#06211D;
  --sage:#8EB69B; --tint:#163832; --green:#7FC79B; --danger:#E0786F; --warn:#D7B46A;
  --ok:#7FC79B; --info:#9FBDB3;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.ic{width:19px;height:19px;flex:0 0 19px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brandmark{height:26px;width:auto;display:block}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:radial-gradient(1200px 500px at 50% -10%, #E9F4EC 0%, var(--bg) 60%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;width:380px;max-width:92vw;box-shadow:0 20px 50px rgba(5,31,32,.10)}
.card .brand{font-size:22px;justify-content:center;gap:12px;margin-bottom:6px}
.card .brand img{width:34px}
.card .brandword{font-weight:800;letter-spacing:.12em;color:var(--txt)}
.card p{color:var(--muted);font-size:13px;text-align:center;margin:0 0 20px}
.card input{width:100%;padding:13px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px}
.card input:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;padding:12px 16px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--green)}
.ver{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent);border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--panel2);vertical-align:middle}
#login .ver{display:block;width:max-content;margin:0 auto 14px}

osition:center;background-size:contain}
/* Login dividido (formulario + imagen) */
#login{padding:0;background:var(--bg)}
.loginwrap{display:flex;width:100%;min-height:100vh}
.loginform{flex:0 0 44%;max-width:540px;display:flex;flex-direction:column;justify-content:center;padding:48px clamp(28px,6vw,80px);background:var(--panel)}
.loginlogo{width:210px;height:98px;margin-bottom:26px}
.loginform h2{font-size:26px;margin:0 0 4px;color:var(--txt);font-weight:800}
.loginform .sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.loginform label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;letter-spacing:.02em}
.loginform input{width:100%;padding:13px 14px;margin-bottom:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px}
.loginform input:focus{outline:none;border-color:var(--accent)}
/* Para cambiar la foto del login: reemplaza el gradiente de .loginhero por  background:url('TU-FOTO.jpg') center/cover;  */
.loginhero{flex:1;position:relative;overflow:hidden;background:linear-gradient(140deg,#0E2A24 0%,#235347 55%,#2E7D5B 100%)}
.loginhero .mark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.16}
.loginhero .mark > div{width:64%;aspect-ratio:852/398}
.loginhero .tag{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:#EAF3EE;font-size:14px;letter-spacing:.06em;opacity:.9}
@media(max-width:860px){.loginhero{display:none}.loginform{flex:1;max-width:none;padding:40px 24px}}

/* LAYOUT */
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh;transition:grid-template-columns .26s cubic-bezier(.4,0,.2,1)}
.layout.sbhide{grid-template-columns:0 1fr}
.sb{background:linear-gradient(180deg,#0B2B26 0%,#051F20 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;transition:opacity .2s ease}
.layout.sbhide .sb{opacity:0;pointer-events:none}
.sb-brand{display:flex;align-items:center;gap:11px;padding:20px 20px 14px}
.sb-brand img{width:30px}
.sb-brand .bt{font-weight:800;letter-spacing:.14em;font-size:16px;line-height:1}
.sb-brand .bs{font-size:11px;color:var(--sage);margin-top:3px}
.sb-brand .ver{margin-left:auto;color:var(--sage);background:rgba(142,182,155,.12);border-color:rgba(142,182,155,.35)}
nav.tabs{display:flex;flex-direction:column;gap:1px;padding:6px 12px;overflow-y:auto;flex:1;border:0;background:none}
.navgroup{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f9488;margin:15px 10px 6px}
nav.tabs button{display:flex;align-items:center;gap:11px;width:100%;justify-content:flex-start;text-align:left;
  background:none;color:#cfe3d7;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;
  transition:transform .14s cubic-bezier(.34,1.56,.64,1),background .14s ease,box-shadow .14s ease,color .14s ease;will-change:transform}
nav.tabs button:hover{background:rgba(255,255,255,.10);color:#fff;transform:translateX(4px) translateY(-2px) scale(1.015);box-shadow:0 6px 16px rgba(0,0,0,.33),0 1px 0 rgba(255,255,255,.08) inset}
nav.tabs button:active{transform:translateX(2px) translateY(0) scale(.99);box-shadow:0 2px 6px rgba(0,0,0,.3)}
nav.tabs button.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--sage)}
nav.tabs button.active:hover{box-shadow:inset 3px 0 0 var(--sage),0 6px 16px rgba(0,0,0,.33)}
.topbar #sbToggle svg{width:20px;height:20px}
.sb-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sb-foot .ava{width:36px;height:36px;border-radius:10px;background:var(--sage);color:#06211D;display:grid;place-items:center;font-weight:800;flex:0 0 36px}
.sb-foot .who{font-size:12.5px;color:#cfe3d7;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot button{background:rgba(255,255,255,.08);color:#cfe3d7;width:34px;height:34px;display:grid;place-items:center;flex:0 0 34px}
.sb-foot button:hover{background:rgba(255,255,255,.16);color:#fff}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:15px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8}
.topbar h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar .sp{flex:1}
.topbar button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
.topbar button:hover{border-color:var(--accent)}
.subtabs{display:flex;gap:6px;margin:4px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtabs .subtab{background:none;border:none;color:var(--muted);padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs .subtab:hover{color:var(--txt)}
.subtabs .subtab.on{color:var(--accent);border-bottom-color:var(--accent)}
#cxFab{position:fixed;right:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:9px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:50px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(35,83,71,.45);transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s}
#cxFab svg{width:22px;height:22px}
#cxFab:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 12px 28px rgba(35,83,71,.55)}
#cxFab:active{transform:translateY(-1px) scale(1)}
#cxFab.on{background:var(--green)}
@media(max-width:560px){#cxFab span{display:none}#cxFab{padding:15px;border-radius:50%}}
main{padding:24px 28px 48px;max-width:none;margin:0;min-width:0}
h1{font-size:20px;margin:0 0 4px}.lead{color:var(--muted);margin:0 0 20px;font-size:13px}
.view{display:none}.view.active{display:block}

/* componentes (heredan tokens → re-skin automático de todas las vistas) */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
tbody tr:hover{background:var(--panel2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(46,125,91,.18)}
.pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.admin,.pill.supervisor,.pill.agent,.pill.editor,.pill.lector,.pill.cajero{background:var(--tint);color:var(--accent);border:1px solid transparent}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(11,43,38,.03)}
.kpi .n{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi .l{color:var(--muted);font-size:12.5px;margin-top:3px}
.formcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;max-width:560px}
.formcard h3{margin:0 0 6px}
.formcard label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.formcard input,.formcard select,.formcard textarea{width:100%;padding:11px;margin-bottom:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px}
.formcard input:focus,.formcard select:focus,.formcard textarea:focus{outline:none;border-color:var(--accent)}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.mini{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 11px;font-size:12px;border-radius:8px}
.mini:hover{border-color:var(--accent)}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--tint);color:var(--ok)}
.badge.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
.badge.mut{background:var(--panel2);color:var(--muted)}
.badge.danger{background:rgba(180,69,60,.12);color:var(--danger);border:1px solid transparent}
.clienterow:hover{background:var(--panel2)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--txt);font-size:13px;font-family:inherit}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.fs{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.reveal{cursor:pointer;user-select:none}
.cx-spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:cxspin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes cxspin{to{transform:rotate(360deg)}}
/* Tabla Base de Datos */
.bd-scroll{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.bd-table{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;min-width:100%}
.bd-table th,.bd-table td{padding:4px 10px;line-height:1.35;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.bd-table tbody td .badge{padding:1px 7px}
.bd-table thead th{position:sticky;top:0;z-index:3;background:var(--panel2);color:var(--txt);font-weight:700;box-shadow:inset 0 -1px 0 var(--line)}
.bd-table tbody tr{cursor:pointer}
.bd-table .bd-actioncol{position:sticky;right:0;background:var(--panel);border-left:1px solid var(--line);text-align:center}
.bd-table thead .bd-actioncol{background:var(--panel2);z-index:4}
.bd-table tbody tr:hover td{background:var(--panel2)}
.bd-table tbody tr:hover .bd-actioncol{background:var(--panel2)}
.bd-table tbody tr.bd-inact td{background:rgba(180,69,60,.10)}
.bd-table tbody tr.bd-inact .bd-actioncol{background:var(--panel)}
.bd-table tbody tr.bd-inact:hover td{background:rgba(180,69,60,.17)}
.bd-table tbody tr.bd-negra td{background:rgba(5,31,32,.12);color:var(--muted)}
.bd-table tbody tr.bd-negra .bd-actioncol{background:var(--panel)}
.bd-table tbody tr.bd-negra:hover td{background:rgba(5,31,32,.2)}
.bd-table td.bd-colhi,.bd-table th.bd-colhi{box-shadow:inset 0 0 0 9999px rgba(142,182,155,.16)}
/* agente */
#agentOnly{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
#agentOnly .brand img{width:46px;margin:0 auto 8px}
.brandword-dark{font-weight:800;letter-spacing:.12em;color:var(--txt);font-size:20px}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .layout.sbhide{grid-template-columns:1fr}
  .layout.sbhide .sb{display:none}
  .sb{position:static;height:auto}
  nav.tabs{flex-direction:row;flex-wrap:wrap;gap:4px}
  .navgroup{width:100%}
  nav.tabs button{width:auto}
  nav.tabs button:hover{transform:none}
  .grid2,.grid3{grid-template-columns:1fr}
  main{padding:20px 16px 40px}
}
</style>
